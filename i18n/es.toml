[llms_choose_text]
other = '''Cada pedido de grupo electrógeno se reduce a seis decisiones: la marca del motor (determina los repuestos y el
tiempo de respuesta de su servicio local), el régimen principal o de respaldo (el principal funciona de 8 a 12
horas al día, el de respaldo es para emergencias; dimensione el grupo para que la carga se sitúe entre el 70 % y
el 80 % de la potencia de respaldo), el voltaje y la frecuencia (400/230 V a 50 Hz, 230/400 V a 60 Hz), la
carcasa (versión abierta, caracola silenciosa, contenedor, remolque), el arranque y la transferencia (arranque
eléctrico con transferencia automática para grupos de respaldo) y el paralelo (más de un grupo necesita un
sistema de gestión de energía). Las condiciones del emplazamiento también importan: cada 1000 m de altitud y
cada 10 °C por encima del ambiente estándar cuestan cerca del 3 % de la potencia.

Garantía: 1 año o 1000 horas. Pedido mínimo: 1 unidad. Opciones de carcasa: versión abierta, caracola
silenciosa, remolque y contenedor. Arranque: eléctrico, con ATS bajo solicitud. Sistemas en paralelo con
gestión de energía disponibles.'''
