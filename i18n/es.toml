## Qué es este sitio

- 44 series de productos, cada una con una tabla completa de especificaciones (modelo, potencia
  principal y de respaldo, motor, alternador, controlador) y un csv descargable
- El buscador de potencia asocia una carga en kW con cada modelo que la cubre
- La herramienta de comparación muestra hasta cuatro series lado a lado
- Cada lista de especificaciones está disponible como csv en /es/download/

