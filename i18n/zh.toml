| 发电机组年产能 | 约 2,000 台 |
| 服务网络 | 全国 35 个销售与办事处 |
| 主要市场 | 中国，出口俄罗斯、印度尼西亚、菲律宾、南非、巴基斯坦、英国等 |
| 工厂 | 福建省福安市坂中工业区下洋 36 号 |
| 国际业务部 | 福建省福州市台江区洋中街道东洋中路融信洋中城 2 号楼 4 层 23 室 |
