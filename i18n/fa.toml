## این سایت چیست

- 44 سری محصول، هر کدام با جدول مشخصات فنی کامل (مدل، توان اصلی و اضطراری، موتور،
  آلترناتور، کنترلر) و فایل csv قابل دانلود
- یابنده توان، بار مورد نیاز شما را با هر مدلی که آن را پوشش می‌دهد تطبیق می‌دهد
- ابزار مقایسه تا چهار سری را کنار هم نشان می‌دهد
- همه فهرست‌های مشخصات فنی به‌صورت csv در /fa/download/ در دسترس هستند

