## خانواده محصولات

- ژنراتورهای دیزلی — /fa/products/diesel-generator-set/ (15 سری موتور، 50 هرتز)
- ژنراتورهای 60 هرتز — /fa/products/60hz-diesel-generator-set/ (6 سری برای قاره‌های آمریکا و بخشی از آسیا)
- آلترناتورهای با کولت — /fa/products/brush-alternator/ (سری STC، از 8 تا 500 کیلووات)
- آلترناتورهای بدون کولت — /fa/products/brushless-alternator/ (سری EL، اتصال SAE)

## کاربردها

- ژنراتورها بر اساس کاربرد — /fa/applications/ (توان مورد نیاز، مدل‌های پوشش‌دهنده و نکات فنی که سفارش را تعیین می‌کنند)
- مراکز داده — /fa/applications/data-centre/
- بیمارستان‌ها — /fa/applications/hospital/
