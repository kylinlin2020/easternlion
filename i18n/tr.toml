[llms_body]
other = '''# Eastern Lion — Fuan Eastern Lion Electric Machines Co., Ltd

> Fuan Eastern Lion Electric Machines Co., Ltd (marka: Eastern Lion, 福建东方电机), dizel
> jeneratör setleri, fırçalı alternatörler ve fırçasız alternatörler üreten Çinli bir üreticidir;
> 1987 yılında Fujian'ın Fuan şehrinde kurulmuştur. Alternatörleri ve komple jeneratör setlerini
> kendi atölyelerinde üretir, sevkiyat öncesi her makineyi yük testinden geçirir ve tüm dünyaya
> satar — 2 kW'tan 2000 kW'a kadar, 50 Hz ve 60 Hz; Cummins, Perkins, Yuchai, YTO, Weichai,
> Kofo, Huachai, Longxin, Lovol, Woling, Yangdong, Yunnei, Yuxing ve Kaixun motor seçenekleriyle.

## Bu site nedir

- 44 ürün serisi; her biri eksiksiz bir teknik özellik tablosu (model, asıl ve yedek güç,
  motor, alternatör, kontrol cihazı) ve indirilebilir bir csv ile
- Güç bulucu, kW cinsinden verilen yükü onu karşılayan her modelle eşleştirir
- Karşılaştırma aracı, dört seriye kadar seriyi yan yana gösterir
- Her teknik özellik listesi /tr/download/ adresinden csv olarak indirilebilir

