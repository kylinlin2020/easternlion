[llms_choose_text]
other = '''Cada pedido de grupo gerador se resume a seis decisões: a marca do motor (ela determina as peças
de reposição e o tempo de resposta do seu parceiro de serviço), regime principal ou standby (a
potência principal funciona de 8 a 12 horas por dia; a standby é para backup de emergência;
dimensione o grupo para que a carga fique entre 70 e 80 % da potência standby), tensão e frequência
(400/230 V a 50 Hz, 230/400 V a 60 Hz), a carcaça (versão aberta, carcaça silenciosa, contêiner,
reboque), partida e transferência (partida elétrica com transferência automática para grupos
standby) e paralelismo (mais de um grupo exige um sistema de gestão de potência). As condições do
local também importam: cada 1000 m de altitude e cada 10 °C acima da temperatura ambiente padrão
custam cerca de 3 % da potência.

Garantia: 1 ano ou 1000 horas. Pedido mínimo: 1 unidade. Opções de carcaça: versão aberta, carcaça
silenciosa, reboque e contêiner. Partida: elétrica, com ATS sob consulta. Sistemas em paralelo com
gestão de potência estão disponíveis.'''
