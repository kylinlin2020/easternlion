[llms_choose_text]
other = '''Chaque commande de groupe électrogène se résume à six décisions : la marque du moteur
(elle détermine les pièces de rechange et le temps de réponse de votre partenaire de service),
le régime principal ou de secours (le principal tourne 8 à 12 heures par jour, le secours sert à
l'alimentation d'urgence ; dimensionnez le groupe pour que la charge se situe à 70 à 80 % de la
puissance de secours), la tension et la fréquence (400/230 V à 50 Hz, 230/400 V à 60 Hz),
l'enveloppe (châssis nu, enceinte insonorisée, conteneur, remorque), le démarrage et la
commutation (démarrage électrique avec un inverseur automatique de source pour les groupes de
secours) et la mise en parallèle (plusieurs groupes nécessitent un système de gestion de
puissance). Les conditions du site comptent aussi : chaque 1000 m d'altitude et chaque 10 °C
au-dessus de l'ambiante standard coûtent environ 3 % de la puissance nominale.

Garantie : 1 an ou 1000 heures. Commande minimale : 1 unité. Options d'enceinte : châssis nu,
enceinte insonorisée, remorque et conteneur. Démarrage : électrique, avec un ATS sur demande.
Des systèmes en parallèle avec gestion de puissance sont disponibles.'''
