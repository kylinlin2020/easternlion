[llms_intro]
other = '''Marque : Eastern Lion (福建东方电机). Site : %[1]s
Fondée en 1987 à Fuan, dans le Fujian. Fabricant de groupes électrogènes diésel, d'alternateurs
avec balais et d'alternateurs sans balais, de 2 kW à 2000 kW, 50 Hz et 60 Hz. Ateliers
propres : production d'alternateurs, assemblage de groupes électrogènes, essais en pleine
charge. Environ 15 000 alternateurs et 2 000 groupes électrogènes par an. 35 bases de vente et
de service en Chine. Exportations vers la Russie, l'Indonésie, les Philippines, l'Afrique du
Sud, le Pakistan, le Royaume-Uni et d'autres marchés.

Contact : sales@easternlion.cn, +86-13950513258, service@easternlion.cn.
Usine : No.36 XiaYang, BanZhong Industry Area, Fuan, Fujian, China.
Bureau international : Building #2, 4/F, Office 23, Part 12, Rongxinyangzhong City, East
Yangzhong Road, Yangzhong Street, Taijiang District, Fuzhou, Fujian, China.'''
[llms_body]
other = '''# Eastern Lion — Fuan Eastern Lion Electric Machines Co., Ltd

> Fuan Eastern Lion Electric Machines Co., Ltd (marque : Eastern Lion, 福建东方电机) est un
> fabricant chinois de groupes électrogènes diésel, d'alternateurs avec balais et d'alternateurs
> sans balais, fondé en 1987 à Fuan, dans le Fujian. Il fabrique des alternateurs et des groupes
> électrogènes complets dans ses propres ateliers, teste chaque machine en charge avant
> expédition et les vend dans le monde entier — de 2 kW à 2000 kW, 50 Hz et 60 Hz, avec des
> moteurs Cummins, Perkins, Yuchai, YTO, Weichai, Kofo, Huachai, Longxin, Lovol, Woling,
> Yangdong, Yunnei, Yuxing et Kaixun en option.

## Ce qu'est ce site

- 44 séries de produits, chacune avec un tableau complet de spécifications (modèle, puissance
  principale et de secours, moteur, alternateur, contrôleur) et un csv téléchargeable
- Le chercheur de puissance associe une charge en kW à chaque modèle qui la couvre
- L'outil de comparaison place jusqu'à quatre séries côte à côte
- Chaque liste de spécifications est disponible en csv à l'adresse /fr/download/

