وزمن استجابة شريك الخدمة)، والقدرة الأساسية أم الاحتياطية (الأساسية تعمل من 8 إلى 12 ساعة
يومياً، والاحتياطية للنسخ الاحتياطي الطارئ؛ اختر حجم المجموعة بحيث يقع الحمل عند 70 إلى 80 % من
القدرة الاحتياطية)، والجهد والتردد (400/230 V عند 50 Hz، و230/400 V عند 60 Hz)، والتغليف
(هيكل مكشوف، كابينة عازلة للصوت، حاوية، مقطورة)، والتشغيل والنقل (تشغيل كهربائي مع
مفتاح نقل تلقائي للمجموعات الاحتياطية) والتوازي (أكثر من مجموعة واحدة يحتاج نظام إدارة قدرة).
وتهمّ ظروف الموقع أيضاً: كل 1000 m من الارتفاع وكل 10 °C فوق الحرارة المحيطة القياسية يكلّفان
نحو 3 % من القدرة.

الضمان: سنة واحدة أو 1000 ساعة. الحد الأدنى للطلب: مجموعة واحدة. خيارات التغليف: هيكل
مكشوف، كابينة عازلة للصوت، مقطورة وحاوية. التشغيل: كهربائي، مع مفتاح نقل تلقائي (ATS) عند الطلب.
وتتوفر أنظمة التوازي مع إدارة القدرة.'''
[llms_faq_h]
other = "الأسئلة الشائعة"
