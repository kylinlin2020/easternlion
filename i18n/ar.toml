## عائلات المنتجات

- مجموعات مولدات ديزل — /ar/products/diesel-generator-set/ (15 سلسلة محركات، 50 Hz)
- مجموعات مولدات 60 Hz — /ar/products/60hz-diesel-generator-set/ (6 سلاسل للأمريكتين وأجزاء من آسيا)
- المولدات التبادلية بمفرشات — /ar/products/brush-alternator/ (سلسلة STC، من 8 kW إلى 500 kW)
- المولدات التبادلية بدون مفرشات — /ar/products/brushless-alternator/ (سلسلة EL، اقتران SAE)

