## ما هو هذا الموقع

- 44 سلسلة منتجات، لكل منها جدول مواصفات كامل (الموديل، والقدرة الأساسية والاحتياطية،
  والمحرك، والمولد التبادلي، ووحدة التحكم) وملف csv قابل للتنزيل
- يطابق محدّد القدرة الحمل بالـ kW مع كل موديل يغطيه
- تضع أداة المقارنة ما يصل إلى أربع سلاسل جنباً إلى جنب
- كل قائمة مواصفات متاحة بصيغة csv على /ar/download/

