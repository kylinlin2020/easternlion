- id: stock
  q: "What kinds of spare parts are in stock?"
  a: "AVR, Storage battery, oil filter, diesel filter, air filter core, control panel, Oil pump"
  q_zh: "常备哪些备件？"
  a_zh: "AVR 调压器、蓄电池、机油滤清器、柴油滤清器、空气滤芯、控制面板、机油泵"
  q_ru: "Какие запасные части есть на складе?"
  a_ru: "AVR, аккумуляторная батарея, масляный фильтр, топливный фильтр, воздушный фильтрующий элемент, панель управления, масляный насос"
  q_es: "¿Qué tipos de repuestos hay en stock?"
  a_es: "AVR, batería de almacenamiento, filtro de aceite, filtro de diésel, núcleo del filtro de aire, panel de control, bomba de aceite"
  q_pt: "Que tipos de peças de reposição estão em estoque?"
  a_pt: "AVR, bateria, filtro de óleo, filtro de diesel, elemento do filtro de ar, painel de controle, bomba de óleo"
  q_ar: "ما أنواع قطع الغيار المتوفرة في المخزون؟"
  a_ar: "AVR، بطارية تخزين، فلتر زيت، فلتر ديزل، قلب فلتر الهواء، لوحة تحكم، مضخة زيت"
