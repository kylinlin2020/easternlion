  a_es: "Sí"
  q_pt: "O cronograma de instalação está disponível mediante solicitação?"
  a_pt: "Sim"
  q_ar: "هل يتوفر جدول التركيب عند الطلب؟"
  a_ar: "نعم"
  q_fr: "Le calendrier d'installation est-il disponible sur demande ?"
