- id: sample
  q: "Can you offer sample?"
  a: "Yes, but the sample is charged, freight as well"
  q_zh: "可以提供样品吗？"
  a_zh: "可以，样品费用及运费由客户承担"
  q_ru: "Можете ли вы предоставить образец?"
  a_ru: "Да, но образец платный, стоимость доставки также"
