{{ define "main" }}
{{ partial "banner.html" . }}
{{ partial "breadcrumb.html" . }}

<section class="inner-main">
  <div class="container">
    <div class="rich">{{ .Content }}</div>

    <div class="app-index-grid">
      {{- range .Pages.ByWeight }}
      <a class="card app-index-card" href="{{ .RelPermalink }}">
        <span class="media">
          <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" loading="lazy">
        </span>
        <span class="body">
          <h3>{{ .Title }}</h3>
          <p>{{ .Description }}</p>
          <span class="more">
            {{ i18n "view_details" }}
            {{ partial "icon.html" (dict "name" "arrow") }}
          </span>
        </span>
      </a>
      {{- end }}
    </div>
  </div>
</section>
{{ end }}
