{{ define "main" }}
{{ partial "banner.html" . }}
{{ partial "breadcrumb.html" . }}
<section class="inner-main">
  <div class="container">
    <div class="rich">
      {{ .Content }}
    </div>

    {{- if .Pages }}
    <div class="news-list" style="margin-top:34px">
      {{- range .Pages }}
      <article class="news-item">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <div class="meta">{{ .Date.Format "2006-01-02" }}</div>
        <p>{{ .Summary | plainify | truncate 180 }}</p>
      </article>
      {{- end }}
    </div>
    {{- end }}
  </div>
</section>
{{ end }}
