<aside class="float-rail" aria-label="Quick contact">
  <div class="rail-head">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .5 1 1V20c0 .6-.5 1-1 1C10.6 21 3 13.4 3 4c0-.6.5-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
    <span>{{ i18n "float_telephone" }}</span>
  </div>
  <div class="rail-tips">
    <a href="tel:{{ replace site.Params.phone "+86-" "" }}">{{ replace site.Params.phone "+86-" "" }}</a>
    <a href="tel:{{ site.Params.mobile }}">{{ site.Params.mobile }}</a>
  </div>

  <div class="rail-head">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    <span>{{ i18n "float_email" }}</span>
  </div>
  <div class="rail-tips">
    <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    <a href="mailto:{{ site.Params.emailService }}">{{ site.Params.emailService }}</a>
  </div>

  <a class="rail-msg" href="{{ "contact/" | relLangURL }}">{{ i18n "float_message" }}</a>
</aside>
