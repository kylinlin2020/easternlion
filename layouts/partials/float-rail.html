{{- /* the quick contact rail: three buttons that slide out on hover */ -}}
<aside class="float-rail" aria-label="{{ i18n "float_rail_label" }}">
  <a class="rail-item" href="tel:{{ replace site.Params.phone "+86-" "" }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .5 1 1V20c0 .6-.5 1-1 1C10.6 21 3 13.4 3 4c0-.6.5-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
    <span class="rail-label">
      <b>{{ i18n "float_telephone" }}</b>
      <i>{{ replace site.Params.phone "+86-" "" }}</i>
    </span>
  </a>

  <a class="rail-item" href="mailto:{{ site.Params.email }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    <span class="rail-label">
      <b>{{ i18n "float_email" }}</b>
      <i>{{ site.Params.email }}</i>
    </span>
  </a>

  <a class="rail-item" href="{{ "contact/" | relLangURL }}#message">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
    <span class="rail-label">
      <b>{{ i18n "float_message" }}</b>
      <i>{{ i18n "float_message_hint" }}</i>
    </span>
  </a>
</aside>
