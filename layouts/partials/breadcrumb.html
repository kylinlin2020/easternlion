{{- $crumbs := .Params.breadcrumb -}}
<nav class="breadcrumb" aria-label="Breadcrumb">
  <div class="container">
    {{ partial "icon.html" (dict "name" "home" "class" "home-icon") }}
    <span>{{ i18n "breadcrumb_here" }}</span>
    <a href="{{ "/" | relLangURL }}">{{ i18n "nav_home" }}</a>
    {{- range $crumbs }}
    <span class="sep">&raquo;</span>
    {{- if .url }}
    <a href="{{ .url | relLangURL }}">{{ .name }}</a>
    {{- else }}
    <span>{{ .name }}</span>
    {{- end }}
    {{- end }}
    <span class="sep">&raquo;</span>
    <span class="is-current">{{ .Title }}</span>
  </div>
</nav>
