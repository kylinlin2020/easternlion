{{- $img := .Params.image -}}
<a class="product-card" href="{{ .RelPermalink }}" title="{{ .Title }}">
  <span class="thumb">
    {{- with $img }}
    <img src="{{ . | relLangURL }}" alt="{{ $.Title }}" loading="lazy">
    {{- else }}
    <img src="{{ "images/logo.png" | relLangURL }}" alt="{{ $.Title }}" loading="lazy">
    {{- end }}
  </span>
  <span class="overlay">{{ .Title }}</span>
</a>
