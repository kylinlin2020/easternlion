{{- $img := .Params.image -}}
<a class="product-card" href="{{ .RelPermalink }}" title="{{ .Title }}">
  <span class="thumb">
    {{- with $img }}
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" loading="lazy">
    {{- else }}
    <img src="{{ "images/logo.png" | relURL }}" alt="{{ $.Title }}" loading="lazy">
    {{- end }}
  </span>
  <span class="body">
    <h3>{{ .Title }}</h3>
    <span class="meta">
      <span>{{ .Params.category | default "" }}</span>
      <span class="more">
        {{ i18n "view_details" }}
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5l7 7-7 7-1.4-1.4L15.2 13H4v-2h11.2l-4.6-4.6L13 5z"/></svg>
      </span>
    </span>
  </span>
</a>
