
<aside class="inquiry-card">
  <h3>{{ i18n "inquiry_title" }}</h3>
  <p>{{ i18n "inquiry_text" }}</p>
  <a class="btn btn-primary" href="{{ "contact/" | relLangURL }}?product={{ .Title | urlquery }}">{{ i18n "inquiry_button" }}</a>
  <a class="inquiry-phone" href="tel:{{ replace site.Params.phone "+86-" "" }}">{{ replace site.Params.phone "+86-" "" }}</a>
  <a class="inquiry-wa" href="https://wa.me/{{ site.Params.whatsapp }}?text={{ printf "Inquiry: %s" .Title | urlquery }}" target="_blank" rel="noopener">
    {{ partial "icon.html" (dict "name" "whatsapp") }}
    {{ i18n "inquiry_whatsapp" }}
  </a>
</aside>
