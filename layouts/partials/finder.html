{{- $id := .id | default "finder" -}}
{{- $slim := eq (.variant | default "") "slim" -}}
<section class="finder{{ if $slim }} finder--slim{{ end }}" id="{{ $id }}">
  <div class="finder-grid">
    <div class="finder-intro">
      <span class="finder-eyebrow">{{ i18n "finder_eyebrow" }}</span>
      {{- if $slim }}
      <h2 class="finder-title finder-title--slim">{{ i18n "finder_title_slim" }}</h2>
      {{- else }}
      <h2 class="finder-title">{{ i18n "finder_title" }}</h2>
      <p class="finder-text">{{ i18n "finder_text" }}</p>
      {{- end }}
      <div class="finder-chips" role="group" aria-label="{{ i18n "finder_quick" }}">
        <button type="button" class="chip" data-kw="50">50 kW</button>
        <button type="button" class="chip" data-kw="100">100 kW</button>
        <button type="button" class="chip" data-kw="200">200 kW</button>
        <button type="button" class="chip" data-kw="500">500 kW</button>
        <button type="button" class="chip" data-kw="1000">1000 kW</button>
      </div>
    </div>

    <form class="finder-form" id="{{ $id }}Form" novalidate>
      <div class="finder-field">
        <label for="{{ $id }}Kw">{{ i18n "finder_kw" }}</label>
        <div class="finder-input">
          <input id="{{ $id }}Kw" type="number" min="1" max="3000" step="1" inputmode="numeric"
                 placeholder="{{ i18n "finder_kw_ph" }}">
          <span class="finder-unit">kW</span>
        </div>
      </div>
      <div class="finder-field">
        <label>{{ i18n "finder_hz" }}</label>
        <div class="seg" id="{{ $id }}Hz">
          <button type="button" class="seg-btn is-active" data-hz="50">50 Hz</button>
          <button type="button" class="seg-btn" data-hz="60">60 Hz</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary finder-go">{{ i18n "finder_go" }}</button>
    </form>
  </div>

  <div class="finder-results" id="{{ $id }}Results" hidden></div>
</section>
